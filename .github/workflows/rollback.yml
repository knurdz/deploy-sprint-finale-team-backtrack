name: Rollback To Known-Good Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Known-good tag, SHA, or artifact id
        required: true
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backtrack-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve rollback target
        run: |
          echo "T04 rollback requested"
          test -n "${{ inputs.release_ref }}"
          echo "release_ref=${{ inputs.release_ref }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout target release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Generate Status File
        run: |
          echo "Team: backtrack" > public/status
          echo "Commit: ${{ github.sha }}" >> public/status
          echo "Release ID: ${{ github.run_id }}" >> public/status
          echo "Deploy Time: $(date -u)" >> public/status
          echo "Marker: T04-rollback" >> public/status
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL || 'Deploy Sprint Finale' }}
        run: npm run build
        working-directory: team-site

      - name: Write safe status evidence
        run: |
          rm -rf team-site/dist/status team-site/dist/health
          mkdir -p team-site/dist/status team-site/dist/health
          printf 'ok' > team-site/dist/health/index.html
          printf '{"task":"T04","commit":"%s","rollback_ref":"%s"}' "$GITHUB_SHA" "${{ inputs.release_ref }}" > team-site/dist/status/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-rollback-${{ github.sha }}
          path: team-site/dist

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ github.sha }}
          TEAM_BRANCH: main
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOYER_DISPATCH_TOKEN:-}" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured."
            exit 0
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-backtrack-main-merged",
              "client_payload": {
                  "team": "backtrack",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json || true
