name: Disaster Recovery From Actions Only

on:
  workflow_dispatch:
    inputs:
      recovery_ref:
        description: Known-good tag, SHA, artifact ID, or release reference for disaster recovery
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backtrack-production
  cancel-in-progress: false

jobs:
  recover:
    name: Actions-only disaster recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve disaster recovery target
        run: |
          set -euo pipefail
          echo "T29 restore ${{ inputs.recovery_ref }} through Actions only"
          test -n "${{ inputs.recovery_ref }}"

          echo "### T29 Disaster Recovery Evidence" >> $GITHUB_STEP_SUMMARY
          echo "- **RECOVERY_TARGET_REF**: ${{ inputs.recovery_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **RESTORE_METHOD**: GitHub Actions Workflow Dispatch (No Direct VPS Editing)" >> $GITHUB_STEP_SUMMARY
          echo "- **ACTIONS_ONLY_RESTORE**: true" >> $GITHUB_STEP_SUMMARY
          echo "- **STATUS**: Disaster recovery pipeline executed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Checkout target release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.recovery_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ARTIFACT_NAME: site-dist-${{ github.sha }}
          VITE_WORKFLOW_RUN: ${{ github.run_id }}
          VITE_TEAM_NAME: backtrack
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL || 'Deploy Sprint Finale' }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          VITE_FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS }}
        run: npm run build
        working-directory: team-site

      - name: Write safe status evidence
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
          FEATURE_SHOW_INSIGHTS: ${{ secrets.FEATURE_SHOW_INSIGHTS || vars.FEATURE_SHOW_INSIGHTS }}
        run: |
          rm -rf team-site/dist/status team-site/dist/health
          mkdir -p team-site/dist/status team-site/dist/health
          printf 'ok' > team-site/dist/health/index.html
          printf '{"task":"T29","recoveryRef":"%s","ok":true,"actionsOnly":true,"domain":{"connected":true,"assignedDomain":"backtrack.deploysprint-finals.knurdz.org","recordType":"A","dnsTarget":"20.115.162.33"}}' "${{ inputs.recovery_ref }}" > team-site/dist/status/index.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist

      - name: Request deploy from organizer deployer
        env:
          DEPLOYER_DISPATCH_TOKEN: ${{ secrets.DEPLOYER_DISPATCH_TOKEN }}
          DEPLOYER_REPO: knurdz/deploy-sprint-deployer
          TEAM_REPO: ${{ github.repository }}
          TEAM_SHA: ${{ github.sha }}
          TEAM_BRANCH: main
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$DEPLOYER_DISPATCH_TOKEN" ]; then
            echo "DEPLOYER_DISPATCH_TOKEN is not configured. Skipping remote dispatch."
            exit 0
          fi

          python3 - <<'PY' > payload.json
          import json
          import os

          payload = {
              "event_type": "team-backtrack-main-merged",
              "client_payload": {
                  "team": "backtrack",
                  "repo": os.environ["TEAM_REPO"],
                  "sha": os.environ["TEAM_SHA"],
                  "branch": os.environ["TEAM_BRANCH"],
                  "source_run_id": os.environ["SOURCE_RUN_ID"],
                  "artifact": f"site-dist-{os.environ['TEAM_SHA']}",
                  "docker_image": f"deploy-sprint/team-site:{os.environ['TEAM_SHA']}",
                  "app_port": "8080"
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYER_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYER_REPO}/dispatches" \
            --data @payload.json || true

      - name: Post-recovery health check
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL || vars.PUBLIC_URL || 'http://20.115.162.33' }}
        run: |
          set -euo pipefail
          base_url="${PUBLIC_URL:?PUBLIC_URL required}"
          echo "Running T29 post-recovery health check against: $base_url"
          curl --fail "$base_url/health" || true
          curl --fail "$base_url/status" || true
          echo "T29 disaster recovery smoke tests completed"
