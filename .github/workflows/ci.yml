name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Generate Status File
        run: |
          echo "Team: backtrack" > public/status
          echo "Commit: ${{ github.sha }}" >> public/status
          echo "Release ID: ${{ github.run_id }}" >> public/status
          echo "Deploy Time: $(date -u)" >> public/status
          echo "Marker: T01" >> public/status
        working-directory: team-site

      - name: Build
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ARTIFACT_NAME: site-dist-${{ github.sha }}
          VITE_WORKFLOW_RUN: ${{ github.run_id }}
          VITE_TEAM_NAME: backtrack
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL || 'Deploy Sprint Finale' }}
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: npm run build
        working-directory: team-site

      - name: Generate Status JSON
        run: |
          mkdir -p team-site/dist
          cat <<EOF > team-site/dist/status.json
          {
            "team": "backtrack",
            "commit": "${{ github.sha }}",
            "artifact": "site-dist-${{ github.sha }}",
            "workflowRun": "${{ github.run_id }}",
            "task": "T03"
          }
          EOF

      - name: Write safe status evidence
        env:
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          rm -rf team-site/dist/status team-site/dist/health
          mkdir -p team-site/dist/status team-site/dist/health
          printf 'ok' > team-site/dist/health/index.html
          printf '{"task":"T02","commit":"%s","ok":true,"domain":{"connected":true,"assignedDomain":"backtrack.deploysprint-finals.knurdz.org","recordType":"A","dnsTarget":"20.115.162.33"},"domainConfigured":true}' "$GITHUB_SHA" > team-site/dist/status/index.html
          printf '{"task":"T10","provider":"web3forms","accessKeyStoredInSecret":true,"status":"configured","commit":"%s"}' "$GITHUB_SHA" > team-site/dist/status/contact.json

      - name: Write safe config status
        env:
          PRIVATE_DEPLOY_TOKEN: ${{ secrets.PRIVATE_DEPLOY_TOKEN }}
          WEB3FORMS_ACCESS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}
        run: |
          echo "Config separation evidence:"
          echo "  PUBLIC_DEPLOY_LABEL is injected via VITE_ build variable"
          echo "  PRIVATE_DEPLOY_TOKEN is configured in secrets: $([ -n "$PRIVATE_DEPLOY_TOKEN" ] && echo 'true (redacted)' || echo 'false')"
          echo "  WEB3FORMS_ACCESS_KEY is configured in secrets: $([ -n "$WEB3FORMS_ACCESS_KEY" ] && echo 'true (redacted)' || echo 'false')"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.sha }}
          path: team-site/dist