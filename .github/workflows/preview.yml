name: PR Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    name: Build & Publish PR Preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: team-site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: team-site

      - name: Build PR Preview
        env:
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL || vars.DOMAIN_PUBLIC_URL || secrets.PUBLIC_URL || vars.IP_PUBLIC_URL }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_ARTIFACT_NAME: preview-site-dist-${{ github.sha }}
          PREVIEW_ARTIFACT_NAME: preview-site-dist-${{ github.sha }}
          VITE_WORKFLOW_RUN: ${{ github.run_id }}
          VITE_TEAM_NAME: backtrack
          VITE_PUBLIC_DEPLOY_LABEL: ${{ vars.PUBLIC_DEPLOY_LABEL || 'Deploy Sprint Finale (PR Preview)' }}
        run: npm run build
        working-directory: team-site

      - name: Upload PR Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site-dist-${{ github.sha }}
          path: team-site/dist

      - name: Generate PR Preview Evidence Summary
        run: |
          echo "### T11 PR Preview Evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR Number**: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PR Commit SHA**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **STATUS_FIELD_ARTIFACT**: preview-site-dist-${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **STATUS_FIELD_WORKFLOW_RUN**: ${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "T11 preview for PR #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
